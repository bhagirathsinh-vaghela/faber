<!doctype html>
<html lang="en" style="background-color: var(--background-base)">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Faber</title>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Faber" />
    <link rel="icon" type="image/png" href="/favicon-96x96-v3.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon-v3.svg" />
    <link rel="shortcut icon" href="/favicon-v3.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#131010" />
    <script id="oc-theme-preload-script" src="/oc-theme-preload.js"></script>
  </head>
  <!-- The document is one collapsible-chrome height (lvh - svh, the
       browser's own measure) taller than the large viewport. A flick on any
       non-scrollable surface (the titlebar) chains to this root scroller,
       the one gesture Safari collapses its bar for. Exactly 100lvh is not
       enough: the collapse grows the viewport, which shrinks the scroll
       range to zero mid-gesture and stalls the bar half-way, so the range
       must survive the collapse. Desktop and the installed PWA have no
       collapsible chrome, so lvh = svh, the height degrades to 100lvh, and
       the range is zero. -->
  <body class="antialiased overscroll-none text-12-regular min-h-[calc(200lvh-100svh)]">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- sticky: the shell stays pinned to the viewport while the document
         scrolls beneath it, so collapsing the bar moves browser chrome only,
         never the app. No overflow clip here: portaled popovers overhang the
         root and a clip on it cuts them off. -->
    <div id="root" class="flex flex-col h-dvh p-px sticky top-0"></div>
    <script src="/src/entry.tsx" type="module"></script>
  </body>
</html>
