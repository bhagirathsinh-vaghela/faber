name: Bug report
description: Report an issue that should be fixed
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug you encountered
      placeholder: What happened?
    validations:
      required: true

  - type: input
    id: plugins
    attributes:
      label: Plugins
      description: What plugins are you using?
    validations:
      required: false

  - type: input
    id: faber-version
    attributes:
      label: Faber version
      description: Which commit or build of Faber are you using?
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can I reproduce this issue?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or recording
      description: Attach a screenshot or screen recording
      placeholder: Drag and drop a file here
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating System
      description: what OS are you using?
      placeholder: e.g., macOS 26.0.1, Ubuntu 22.04
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: Which browser and device are you using?
      placeholder: e.g., Safari on iPhone 15, Chrome on macOS
    validations:
      required: false
